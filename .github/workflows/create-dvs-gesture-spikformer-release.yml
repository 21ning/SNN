name: Create DVS Gesture Spikformer Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: dvs-gesture-spikformer-20260610
      ASSET_DIR: release-assets/dvs_gesture_spikformer_full_with_deps_20260610
      ASSET_NAME: dvs_gesture_spikformer_full_with_deps_20260610.tar.gz
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct archive
        run: |
          set -euo pipefail
          cd "$ASSET_DIR"
          cat "$ASSET_NAME".part-* > "$ASSET_NAME"
          sha256sum -c SHA256SUMS.txt
          ls -lh "$ASSET_NAME"

      - name: Create or update GitHub Release with REST API
        shell: bash
        run: |
          set -u
          cd "$ASSET_DIR"
          NOTES_JSON=$(jq -Rs . < RELEASE_NOTES.md)
          CREATE_BODY=$(jq -nc --arg tag "$TAG" --arg name "DVS Gesture Spikformer full package 20260610" --argjson body "$NOTES_JSON" '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}')

          echo "Checking existing release: $TAG"
          release_json=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          release_body=$(printf '%s' "$release_json" | sed '$d')
          release_code=$(printf '%s' "$release_json" | tail -n1)

          if [ "$release_code" = "200" ]; then
            upload_url=$(printf '%s' "$release_body" | jq -r '.upload_url' | sed 's/{?name,label}//')
            release_id=$(printf '%s' "$release_body" | jq -r '.id')
            echo "Release exists: $release_id"
          elif [ "$release_code" = "404" ]; then
            echo "Creating release"
            created=$(curl -sS -w '\n%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "$CREATE_BODY")
            created_body=$(printf '%s' "$created" | sed '$d')
            created_code=$(printf '%s' "$created" | tail -n1)
            if [ "$created_code" != "201" ]; then
              msg=$(printf '%s' "$created_body" | jq -r '.message // .' 2>/dev/null || printf '%s' "$created_body")
              echo "::error title=Release create failed::HTTP ${created_code}: ${msg}"
              printf '%s\n' "$created_body"
              exit 1
            fi
            upload_url=$(printf '%s' "$created_body" | jq -r '.upload_url' | sed 's/{?name,label}//')
            release_id=$(printf '%s' "$created_body" | jq -r '.id')
            echo "Release created: $release_id"
          else
            msg=$(printf '%s' "$release_body" | jq -r '.message // .' 2>/dev/null || printf '%s' "$release_body")
            echo "::error title=Release lookup failed::HTTP ${release_code}: ${msg}"
            printf '%s\n' "$release_body"
            exit 1
          fi

          echo "Deleting existing asset with same name if present"
          assets_json=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets")
          old_asset_id=$(printf '%s' "$assets_json" | jq -r --arg name "$ASSET_NAME" '.[] | select(.name==$name) | .id' | head -n1)
          if [ -n "$old_asset_id" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${old_asset_id}" >/dev/null
          fi

          echo "Uploading asset: $ASSET_NAME"
          uploaded=$(curl -sS -w '\n%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${ASSET_NAME}" \
            "${upload_url}?name=${ASSET_NAME}")
          uploaded_body=$(printf '%s' "$uploaded" | sed '$d')
          uploaded_code=$(printf '%s' "$uploaded" | tail -n1)
          if [ "$uploaded_code" != "201" ]; then
            msg=$(printf '%s' "$uploaded_body" | jq -r '.message // .' 2>/dev/null || printf '%s' "$uploaded_body")
            echo "::error title=Release asset upload failed::HTTP ${uploaded_code}: ${msg}"
            printf '%s\n' "$uploaded_body"
            exit 1
          fi
          printf '%s\n' "$uploaded_body" | jq '{name,size,browser_download_url}'
